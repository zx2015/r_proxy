services:
  r-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: r-proxy:0.1.0
    container_name: r-proxy
    restart: unless-stopped
    # host 网络而非端口发布：6060 的访问控制靠 firewalld 的源网段 rich rule，
    # 而发布端口走 DNAT，不经过 INPUT 链，会把代理暴露给全网。host 模式还顺带
    # 保住了请求日志里的客户端真实 IP，Web 界面也能继续只绑回环。
    # 副作用：`docker ps`/`docker compose ps` 的 PORTS 列永远是空的——host 模式
    # 不经 Docker 的端口发布机制，这不代表端口没开，用 `ss -ltnp` 看宿主监听。
    network_mode: host
    environment:
      R_PROXY_CONFIG: /config/config.toml
    volumes:
      # 本机（mini-server）独立数据盘挂在 /media/data（见
      # docs/design/DD_DEPLOY.md §9.x 机器清单），真实的部署数据一直落在
      # /media/data/r-proxy-docker/{config,data}——不是本文件曾经写的
      # /var/lib/r-proxy-docker（那条路径在这台机器上从未有数据，是文档模板
      # 路径与本机实际路径的一次未记录漂移，2026-08-31 更新部署时发现并修正）。
      - /media/data/r-proxy-docker/config:/config
      - /media/data/r-proxy-docker/data:/data
      # slim 镜像默认 UTC，不挂时区的话日志时间和宿主差 8 小时。
      - /etc/localtime:/etc/localtime:ro
    # 容器默认 nofile 软限 1024，低于 max_client_connections 所需的余量，
    # 启动时会报 W_NOFILE_LOW，高并发下表现为 accept 失败。
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # 留足时间让写者线程把队列刷盘，默认 10s 在写队列积压时可能被强杀。
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
